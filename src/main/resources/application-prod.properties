# ===============================
# WebEmpresarial - Producción
# ===============================

# Servidor
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.context-path=/

# Aplicación
app.base-url=${APP_BASE_URL}
app.environment=${APP_ENVIRONMENT:prod}

# ===============================
# Zona horaria
# ===============================
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=dd/MM/yyyy HH:mm

# ===============================
# Base de datos
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.auto-commit=true

# ===============================
# JPA / Flyway
# ===============================
# El esquema productivo es gestionado exclusivamente por Flyway.
# Hibernate valida que el modelo JPA coincida con el esquema migrado.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# Stripe
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.price.basic=${STRIPE_PRICE_BASIC}
stripe.price.pro=${STRIPE_PRICE_PRO}
stripe.price.premium=${STRIPE_PRICE_PREMIUM}

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# MailerSend
# ===============================
mailersend.api.key=${MAILERSEND_API_KEY}
mailersend.api.url=https://api.mailersend.com/v1/email
mailersend.from.email=${MAILERSEND_FROM_EMAIL}
mailersend.from.name=${MAILERSEND_FROM_NAME:WebEmpresarial}
mailersend.reply.to=${MAILERSEND_REPLY_TO}


# ===============================
# Multipart
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===============================
# Orders
# ===============================
orders.outbox.fixed-delay-ms=10000
orders.outbox.recovery-delay-ms=120000
orders.outbox.stale-after-minutes=10

# ===============================
# Inventory
# ===============================
inventory.low-stock-threshold=5
inventory.critical-stock-threshold=2
inventory.alerts.reconciliation-delay-ms=900000

# ===============================
# Bootstrap inicial SUPER_ADMIN
# ===============================
# Debe habilitarse solo para crear la primera cuenta administrativa
# y volver a false inmediatamente después.
app.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.full-name=${SUPER_ADMIN_FULL_NAME:WebEmpresarial}
