<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          th:content="${description} ?: 'WebEmpresarial™'">

    <title th:text="${title}">
        WebEmpresarial
    </title>

    <!-- Favicon dinámico -->

    <link rel="icon"
          th:if="${settings != null
              and settings.faviconUrl != null
              and !settings.faviconUrl.isBlank()}"
          th:href="${settings.faviconUrl}">

    <!-- Fallback -->

    <link rel="icon"
          type="image/x-icon"
          th:if="${settings == null
              or settings.faviconUrl == null
              or settings.faviconUrl.isBlank()}"
          th:href="@{|/themes/${theme}/favicon.ico|}">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <!-- Variables White Label -->

    <style th:inline="css">

        :root {

            --store-primary:
                [[${settings != null && settings.primaryColor != null
                    ? settings.primaryColor
                    : '#111827'}]];

            --store-secondary:
                [[${settings != null && settings.secondaryColor != null
                    ? settings.secondaryColor
                    : '#6B7280'}]];

            --store-accent:
                [[${settings != null && settings.accentColor != null
                    ? settings.accentColor
                    : '#2563EB'}]];

            --store-font:
                [[${settings != null && settings.fontFamily != null
                    ? settings.fontFamily
                    : 'Inter'}]];
        }

        body {
            font-family:
                var(--store-font),
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

    </style>

    <!-- CSS Theme -->

    <link rel="stylesheet"
          th:href="@{|/themes/${theme}/assets/css/style.css|}">

    <!-- Custom CSS Premium -->

    <style
            th:if="${settings != null
                and settings.customCss != null
                and !settings.customCss.isBlank()}"
            th:utext="${settings.customCss}">
    </style>

<th:block th:if="${settings != null
    and settings.googleAnalyticsId != null
    and !settings.googleAnalyticsId.isBlank()}">

<script async
        src="https://www.googletagmanager.com/gtag/js?id="
        th:src="'https://www.googletagmanager.com/gtag/js?id=' + ${settings.googleAnalyticsId}">
</script>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
</script>

<script th:inline="javascript"
        th:if="${features.canUseWhiteLabel(store)
            and settings != null
            and settings.googleAnalyticsId != null
            and !settings.googleAnalyticsId.isBlank()}">
    const GA_ID = /*[[${settings.googleAnalyticsId}]]*/ "";
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", GA_ID);
</script>
</th:block>

            and settings != null
            and settings.metaPixelId != null
            and !settings.metaPixelId.isBlank()}">
    const META_PIXEL_ID = /*[[${settings.metaPixelId}]]*/ "";

</th:block>

<th:block th:if="${features.canUseWhiteLabel(store)
    and settings != null
    and settings.hotjarId != null		
    and !settings.hotjarId.isBlank()}">

<script th:inline="javascript"
        th:if="${features.canUseWhiteLabel(store)
            and settings != null
            and settings.hotjarId != null
            and !settings.hotjarId.isBlank()}">

</head>

<body>

<!-- NAVBAR -->

<div th:replace="~{themes/__${theme}__/fragments/navbar :: navbar}">
</div>

<!-- CART -->

<th:block th:if="${showCart}">
    <div th:replace="~{themes/__${theme}__/fragments/cart :: cart}">
    </div>
</th:block>

<!-- CHECKOUT -->

<th:block th:if="${showCheckout}">
    <div th:replace="~{themes/__${theme}__/fragments/checkout :: checkout}">
    </div>
</th:block>

<!-- AUTH -->

<th:block th:if="${showAuth}">
    <div th:replace="~{themes/__${theme}__/fragments/auth :: auth}">
    </div>
</th:block>

<!-- PAGE -->

<main>

    <div th:replace="${content}">
    </div>

</main>

<!-- FOOTER -->

<footer th:replace="~{themes/__${theme}__/fragments/footer :: footer}">
</footer>

<!-- THEME SCRIPTS -->

<div th:if="${showScripts}"
     th:replace="~{themes/__${theme}__/fragments/scripts :: scripts}">
</div>

<script>
    document.documentElement.classList.add('js-enabled');
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS Premium -->

<script
        th:if="${settings != null
            and settings.customJs != null
            and !settings.customJs.isBlank()}"
        th:utext="${settings.customJs}">
</script>

</body>

</html>
