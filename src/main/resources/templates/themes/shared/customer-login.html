<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="loginPage">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${store != null
            ? 'Login | ' + store.nombre
            : 'Login'}">
        Login
    </title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.12),
                    transparent 36%
                ),
                #f8fafc;

            color: #111827;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .customer-login {
            width: min(100%, 430px);
        }

        .login-card {
            padding: 36px;

            border: 1px solid #e5e7eb;
            border-radius: 20px;

            background: #ffffff;

            box-shadow:
                0 24px 60px
                rgba(15, 23, 42, 0.10);
        }

        .brand {
            margin-bottom: 6px;

            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0 0 28px;

            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 0.9rem;
            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            background: #ffffff;
            color: #111827;

            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(37, 99, 235, 0.14);
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;

            margin-top: 4px;
            padding: 13px 18px;

            border: 0;
            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            font: inherit;
            font-weight: 800;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1f2937;
        }

        .alert {
            margin-bottom: 20px;
            padding: 11px 13px;

            border-radius: 10px;

            font-size: 0.9rem;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
        }

        .alert-success {
            background: #ecfdf5;
            color: #065f46;
        }

        .back-link {
            display: block;

            margin-top: 22px;

            color: #4b5563;

            text-align: center;
            text-decoration: none;

            font-size: 0.92rem;
        }

        .back-link:hover {
            color: #111827;
        }
    </style>
</head>

<body>

<main class="customer-login">

    <section class="login-card">

        <h1 class="brand"
            th:text="${store != null
                ? store.nombre
                : 'Mi cuenta'}">
            Mi cuenta
        </h1>

        <p class="subtitle">
            Accede a tu cuenta
        </p>

        <div th:if="${param.error}"
             class="alert alert-error">
            Correo o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}"
             class="alert alert-success">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}"
              method="post">

            <th:block th:replace="~{fragments/csrf :: token}">
            </th:block>

            <div class="form-group">
                <label for="username">
                    Correo electrónico
                </label>

                <input type="email"
                       id="username"
                       name="username"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit"
                    class="login-btn">
                Iniciar sesión
            </button>

        </form>

        <a th:href="@{/}"
           class="back-link">
            ← Volver a la tienda
        </a>

    </section>

</main>

</body>
</html>
