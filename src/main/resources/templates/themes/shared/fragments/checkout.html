<section th:fragment="checkout"
         xmlns:th="http://www.thymeleaf.org">

    <div id="checkoutModal"
         class="modal fade"
         tabindex="-1"
         role="dialog">

        <div class="modal-dialog modal-dialog-centered"
             role="document">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Finalizar compra
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Cerrar">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="checkoutForm"
                          novalidate>

                        <input type="hidden"
                               id="orderId"
                               name="orderId">

                        <div class="form-group">
                            <label for="fullName">
                                Nombre completo
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   name="fullName"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="email">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="phone">
                                Teléfono
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="address">
                                Dirección de envío
                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      name="address"
                                      rows="3"
                                      required>
                            </textarea>
                        </div>

                        <div class="form-group mt-3">

                            <label>
                                <b>Método de pago</b>
                            </label>

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       name="paymentMethod"
                                       id="payTransfer"
                                       value="TRANSFER"
                                       checked>

                                <label class="form-check-label"
                                       for="payTransfer">
                                    Transferencia SPEI
                                </label>

                            </div>

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="radio"
                                       id="payStripe"
                                       name="paymentMethod"
                                       value="STRIPE"
                                       th:disabled="${store == null or !store.stripeConnected}">

                                <label class="form-check-label"
                                       for="payStripe">

                                    Tarjeta de crédito / débito

                                    <small th:if="${store == null or !store.stripeConnected}">
                                        (Conecta Stripe para aceptar pagos con tarjeta)
                                    </small>

                                </label>

                            </div>

                        </div>

                    </form>

                    <div class="total-box">
                        <strong>Total:</strong>
                        <span id="modalTotal">$0</span>
                    </div>

                </div>

                <div class="modal-footer">

                    <div id="checkoutErrors"></div>

                    <button type="button"
                            id="finalizeButton"
                            class="btn btn-success">
                        Finalizar pedido
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>
