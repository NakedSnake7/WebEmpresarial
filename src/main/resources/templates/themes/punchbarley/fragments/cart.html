<div th:fragment="cart">

  <!-- FLOATING CART -->
  <button class="cart-float"
          id="cart-float-btn"
          aria-label="Abrir carrito">

    🛒

    <div class="cart-counter" id="cartCounter">
      0
    </div>

  </button>

  <!-- OVERLAY -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- DRAWER -->
  <div class="cart-drawer" id="cartDropdown">

    <!-- HEADER -->
    <div class="cart-drawer-header">

      <span class="cart-drawer-title">
        Tu Carrito
      </span>

      <button class="cart-drawer-close"
              id="cartClose"
              aria-label="Cerrar carrito">

        ✕

      </button>

    </div>

    <!-- ENVIO -->
    <div class="cart-envio-container"
         id="envioGratisContainer">

      <div class="cart-envio-msg"
           id="envioGratisMensaje">

        Agrega más para envío gratis

      </div>

      <div class="cart-envio-track">
        <div class="cart-envio-fill"
             id="envioGratisBarra">
        </div>
      </div>

    </div>

    <!-- ITEMS -->
    <ul class="cart-items-list" id="cartItems">

      <div class="cart-empty-msg"
           id="cartEmpty">

        <span class="empty-icon">🍺</span>
        <span>Tu carrito está vacío</span>

      </div>

    </ul>

    <!-- CUPON -->
    <div class="cart-coupon-area">

      <div class="cart-coupon-row">

        <input type="text"
               class="cart-coupon-input"
               id="couponInput"
               placeholder="Código de cupón">

        <button class="cart-coupon-btn"
                id="applyCouponBtn">

          Aplicar

        </button>

      </div>

      <div class="cart-coupon-error"
           id="couponError">
      </div>

    </div>

    <!-- FOOTER -->
    <div class="cart-footer"
         id="cartFooter"
         style="display:none;">

      <div id="cartResumenDesglose"></div>

      <div class="cart-resumen-line total">

        <span>Total</span>

        <strong id="cartTotal">
          $0.00
        </strong>

      </div>

      <button class="cart-checkout-btn"
              id="checkoutButton">

        Ir a pagar →

      </button>

    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span id="toastMsg"></span>
  </div>

</div>
