<div th:fragment="checkout">

  <div id="checkoutModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content punch-modal-content">

        <div class="modal-header punch-modal-header">
          <div>
            <p class="punch-modal-label">Checkout seguro</p>
            <h5 class="modal-title punch-modal-title">Finalizar compra</h5>
          </div>

          <button type="button"
                  class="punch-modal-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar">
            ✕
          </button>
        </div>

        <div class="modal-body punch-modal-body">

          <form id="checkoutForm" novalidate>
            <input type="hidden" id="orderId" name="orderId">

            <div class="punch-form-group">
              <label for="fullName">Nombre completo</label>
              <input type="text"
                     id="fullName"
                     name="fullName"
                     class="punch-input"
                     placeholder="Tu nombre completo"
                     required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="punch-form-group">
              <label for="email">Correo electrónico</label>
              <input type="email"
                     id="email"
                     name="email"
                     class="punch-input"
                     placeholder="tu@email.com"
                     required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="punch-form-group">
              <label for="phone">Teléfono</label>
              <input type="tel"
                     id="phone"
                     name="phone"
                     class="punch-input"
                     placeholder="10 dígitos"
                     required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="punch-form-group">
              <label for="address">Dirección de envío</label>
              <textarea id="address"
                        name="address"
                        rows="3"
                        class="punch-input"
                        placeholder="Calle 20 #102, Col. Centro, 01109, CDMX"
                        required></textarea>
              <div class="invalid-feedback"></div>
            </div>

            <div class="punch-payment-box">
              <label class="punch-payment-title">Método de pago</label>

              <label class="punch-radio-option" for="payTransfer">
                <input type="radio"
                       name="paymentMethod"
                       id="payTransfer"
                       value="TRANSFER"
                       checked>
                <span>
                  Transferencia SPEI
                  <small>Recibirás los datos bancarios por correo.</small>
                </span>
              </label>

              <label class="punch-radio-option disabled" for="payStripe">
                <input type="radio"
                       name="paymentMethod"
                       id="payStripe"
                       value="STRIPE"
                       disabled>
                <span>
                  Tarjeta crédito / débito
                  <small>No disponible por el momento.</small>
                </span>
              </label>
            </div>
          </form>

          <div id="modalResumenDesglose" class="punch-modal-summary"></div>

          <div class="punch-total-box">
            <span>Total</span>
            <strong id="modalTotal">$0.00</strong>
          </div>

          <p class="punch-secure-note">✔ Sin costos ocultos · Compra segura · Envíos a México</p>

          <div id="checkoutErrors" class="punch-errors"></div>

        </div>

        <div class="modal-footer punch-modal-footer">
          <button type="button"
                  id="finalizeButton"
                  class="punch-finalize-btn">
            Finalizar pedido →
          </button>

          <p class="punch-footer-note">
            🔒 Compra 100% segura · 📦 Envíos a todo México · 💬 Soporte por WhatsApp
          </p>
        </div>

      </div>
    </div>
  </div>

</div>
