<div th:fragment="auth">

  <div class="modal fade" id="registroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content punch-modal-content">

        <div class="modal-header punch-modal-header">
          <div>
            <p class="punch-modal-label">Únete a Punch Barley</p>
            <h5 class="modal-title punch-modal-title">Crear cuenta</h5>
          </div>

          <button type="button"
                  class="punch-modal-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar">
            ✕
          </button>
        </div>

        <form id="registroForm">

          <div class="modal-body punch-modal-body">

            <div class="punch-form-group">
              <label>Nombre completo</label>
              <input type="text"
                     name="fullName"
                     class="punch-input"
                     placeholder="Tu nombre completo"
                     required>
            </div>

            <div class="punch-form-group">
              <label>Correo electrónico</label>
              <input type="email"
                     name="email"
                     class="punch-input"
                     placeholder="tu@email.com"
                     required>
            </div>

            <div class="punch-form-group">
              <label>Teléfono</label>
              <input type="tel"
                     name="phone"
                     class="punch-input"
                     placeholder="Opcional">
            </div>

            <div class="punch-form-group">
              <label>Contraseña</label>
              <input type="password"
                     name="password"
                     class="punch-input"
                     placeholder="Crea una contraseña"
                     required>
            </div>

            <div id="registroMsg" class="punch-register-msg d-none"></div>

          </div>

          <div class="modal-footer punch-modal-footer">
            <button type="button"
                    class="punch-secondary-btn"
                    data-bs-dismiss="modal">
              Cancelar
            </button>

            <button type="submit"
                    class="punch-finalize-btn"
                    id="registroBtn">
              Registrarme →
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

</div>
