<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Login | Barley Punch</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@300;400;600&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --black: #0a0a0b;
      --dark: #111114;
      --gold: #c9952a;
      --gold-light: #e8b84b;
      --cream: #f0e6c8;
      --rust: #8b2e0f;
      --white: #faf7f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--cream);
      font-family: 'Libre Baskerville', serif;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      padding: 1.2rem;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 5;
      opacity: .35;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 50% 20%, rgba(201,149,42,.12), transparent 65%),
        radial-gradient(ellipse 35% 45% at 85% 75%, rgba(139,46,15,.18), transparent 70%),
        radial-gradient(ellipse 35% 45% at 10% 90%, rgba(201,149,42,.08), transparent 70%);
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: rgba(17,17,20,.82);
      border: 1px solid rgba(201,149,42,.25);
      padding: 2.4rem 2rem;
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      backdrop-filter: blur(14px);
    }

    .brand-link {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-bottom: 1rem;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: .14em;
      color: var(--gold);
      line-height: 1;
    }

    .brand span {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: .65rem;
      letter-spacing: .38em;
      color: rgba(240,230,200,.55);
      margin-top: .35rem;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      color: rgba(240,230,200,.58);
      font-size: .88rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .alert {
      margin-bottom: 1rem;
      padding: .85rem 1rem;
      font-family: 'Oswald', sans-serif;
      font-size: .78rem;
      letter-spacing: .08em;
      text-align: center;
      border: 1px solid transparent;
    }

    .alert-error {
      background: rgba(139,46,15,.18);
      border-color: rgba(139,46,15,.6);
      color: #ff9b78;
    }

    .alert-success {
      background: rgba(201,149,42,.12);
      border-color: rgba(201,149,42,.45);
      color: var(--gold-light);
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .5rem;
    }

    input {
      width: 100%;
      padding: .9rem 1rem;
      background: rgba(240,230,200,.05);
      border: 1px solid rgba(201,149,42,.28);
      color: var(--cream);
      font-family: 'Libre Baskerville', serif;
      font-size: .88rem;
      outline: none;
      transition: .25s;
    }

    input::placeholder {
      color: rgba(240,230,200,.28);
    }

    input:focus {
      border-color: var(--gold);
      background: rgba(240,230,200,.075);
    }

    .login-btn {
      width: 100%;
      margin-top: .6rem;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--black);
      padding: 1rem;
      font-family: 'Oswald', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .25s;
    }

    .login-btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(201,149,42,.28);
    }

    .extra-links {
      margin-top: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: .7rem;
    }

    .extra-links a,
    .register-trigger {
      color: rgba(240,230,200,.55);
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: .25s;
    }

    .extra-links a:hover,
    .register-trigger:hover {
      color: var(--gold);
    }

    .divider {
      height: 1px;
      background: rgba(201,149,42,.18);
      margin: 1.5rem 0 1.2rem;
    }

    .trust-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      font-family: 'Oswald', sans-serif;
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(240,230,200,.35);
    }

    .trust-row span::before {
      content: "✦";
      color: var(--gold);
      margin-right: .4rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.4rem;
      }

      .brand {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

<div class="bg-glow"></div>

<div class="login-wrapper">

  <div class="login-card">

    <a th:href="@{/}" class="brand-link">
      <h1 class="brand">
        BARLEY PUNCH
        <span>Cerveza artesanal mexicana</span>
      </h1>
    </a>

    <p class="subtitle">
      Accede a tu cuenta y continúa disfrutando del sabor que da el golpe.
    </p>

    <div th:if="${param.error}"
         class="alert alert-error">
      Credenciales incorrectas
    </div>

    <div th:if="${param.logout}"
         class="alert alert-success">
      Sesión cerrada correctamente
    </div>

    <form th:action="@{/login}" method="post">
    <th:block th:replace="~{fragments/csrf :: token}"></th:block>

      <div class="form-group">
        <label for="username">Correo electrónico</label>
        <input id="username"
               type="email"
               name="username"
               placeholder="tu@email.com"
               autocomplete="email"
               required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               name="password"
               placeholder="Tu contraseña"
               autocomplete="current-password"
               required>
      </div>

      <button type="submit"
              class="login-btn">
        Iniciar sesión →
      </button>

    </form>

    <div class="divider"></div>

    <div class="extra-links">
      <a th:href="@{/}">
        ← Volver al inicio
      </a>

      <a th:href="@{/?registro=true}"
         class="register-trigger">
        ¿No tienes cuenta? Crear cuenta
      </a>
    </div>

    <div class="trust-row">
      <span>Pago seguro</span>
      <span>Envíos a México</span>
    </div>

  </div>

</div>

</body>
</html>
