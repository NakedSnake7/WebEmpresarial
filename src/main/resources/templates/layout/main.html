<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          <meta name="description"
      th:content="${description} ?: 'WebEmpresarial™ | Ecommerce, páginas web y sistemas empresariales'">

    <title th:text="${title} ?: 'WebEmpresarial'">
        WebEmpresarial
    </title>
<link rel="icon"
      type="image/x-icon"
      th:href="@{|/themes/${theme}/favicon.ico|}">
      
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


          
        
   

    <!-- CSS dinámico -->
    <link rel="stylesheet"
          th:href="@{|/themes/${theme}/assets/css/style.css|}">

</head>

<body>

<div th:replace="~{themes/__${theme}__/fragments/banner :: banner}"></div>

<div th:replace="~{themes/__${theme}__/fragments/navbar :: navbar}"></div>

<th:block th:if="${showCart}">
    <div th:replace="~{themes/__${theme}__/fragments/cart :: cart}"></div>
</th:block>

<th:block th:if="${showCheckout}">
    <div th:replace="~{themes/__${theme}__/fragments/checkout :: checkout}"></div>
</th:block>

<th:block th:if="${showAuth}">
    <div th:replace="~{themes/__${theme}__/fragments/auth :: auth}"></div>
</th:block>

<!-- AQUÍ VA EL CONTENIDO DE index.html -->
<main>
    <div th:replace="${content}"></div>
</main>

<footer th:replace="~{themes/__${theme}__/fragments/footer :: footer}"></footer>

<div th:if="${showScripts}"
     th:replace="~{themes/__${theme}__/fragments/scripts :: scripts}">
</div>

    <script>
        document.documentElement.classList.add('js-enabled');
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
