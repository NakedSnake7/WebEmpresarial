<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          th:content="${description} ?: 'WebEmpresarial™ | Ecommerce, páginas web y sistemas empresariales'">

    <title th:text="${title} ?: ${store != null ? store.nombre : 'WebEmpresarial'}">
        WebEmpresarial
    </title>

    <!-- Favicon dinámico por tienda -->
    <link rel="icon"
          th:if="${settings != null and settings.faviconUrl != null and !settings.faviconUrl.isBlank()}"
          th:href="${settings.faviconUrl}">

    <!-- Favicon fallback del theme -->
    <link rel="icon"
          type="image/x-icon"
          th:if="${settings == null or settings.faviconUrl == null or settings.faviconUrl.isBlank()}"
          th:href="@{|/themes/${theme}/favicon.ico|}">

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <!-- Branding White Label -->
    <style th:inline="css">
        :root {
            --store-primary: [[${settings != null && settings.primaryColor != null ? settings.primaryColor : '#111827'}]];
            --store-secondary: [[${settings != null && settings.secondaryColor != null ? settings.secondaryColor : '#6B7280'}]];
            --store-accent: [[${settings != null && settings.accentColor != null ? settings.accentColor : '#2563EB'}]];
            --store-font: [[${settings != null && settings.fontFamily != null ? settings.fontFamily : 'Inter'}]];
        }

        body {
            font-family: var(--store-font), system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>

    <!-- CSS del theme -->
    <link rel="stylesheet"
          th:href="@{|/themes/${theme}/assets/css/style.css|}">
</head>

<body>


<div th:replace="~{themes/__${theme}__/fragments/navbar :: navbar}"></div>

<th:block th:if="${showCart}">
    <div th:replace="~{themes/__${theme}__/fragments/cart :: cart}"></div>
</th:block>

<th:block th:if="${showCheckout}">
    <div th:replace="~{themes/__${theme}__/fragments/checkout :: checkout}"></div>
</th:block>

<th:block th:if="${showAuth}">
    <div th:replace="~{themes/__${theme}__/fragments/auth :: auth}"></div>
</th:block>

<!-- CONTENIDO DEl index.html -->
<main>
    <div th:replace="${content}"></div>
</main>

<footer th:replace="~{themes/__${theme}__/fragments/footer :: footer}"></footer>

<script>
    document.documentElement.classList.add('js-enabled');
</script>

<div th:if="${showScripts}"
     th:replace="~{themes/__${theme}__/fragments/scripts :: scripts}">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
