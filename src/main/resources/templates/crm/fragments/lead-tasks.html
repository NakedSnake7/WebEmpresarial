<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tasks(lead)" class="crm-panel">

    <div class="crm-panel-header">
        <div>
            <span class="crm-kicker">Tasks</span>
            <h3>Tareas del Lead</h3>
        </div>

        <span class="badge text-bg-dark"
              th:text="${#lists.size(lead.tasks)} + ' tareas'">
            0 tareas
        </span>
    </div>

    <div class="mt-3">

        <div th:if="${#lists.isEmpty(lead.tasks)}"
             class="crm-empty">
            No hay tareas registradas para este lead.
        </div>

        <div th:each="task : ${lead.tasks}"
             class="border rounded p-3 mb-2">

            <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                    <h6 class="fw-bold mb-1"
                        th:text="${task.title}">
                        Tarea
                    </h6>

                    <p class="text-muted mb-2"
                       th:text="${task.description}">
                        Descripción
                    </p>

                    <small class="text-secondary">
                        Vence:
                        <span th:text="${task.dueAt != null ? #temporals.format(task.dueAt, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}">
                            —
                        </span>
                    </small>
                </div>

                <div class="text-end">
                    <span class="badge text-bg-secondary mb-1"
                          th:text="${task.status}">
                        PENDING
                    </span>

                    <br>

                    <span class="badge text-bg-dark"
                          th:text="${task.priority}">
                        MEDIUM
                    </span>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
