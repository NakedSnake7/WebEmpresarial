<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="duplicates(lead)" class="crm-panel">

    <div class="crm-panel-header">
        <div>
            <span class="crm-kicker">Duplicates</span>
            <h3>Duplicados / Merge</h3>
        </div>

        <span class="badge text-bg-secondary">
            CRM
        </span>
    </div>

    <div class="mt-3">

        <p class="text-muted small">
            Usa el motor de duplicados para revisar coincidencias por WhatsApp,
            Instagram, nombre y empresa.
        </p>

        <div class="border rounded p-3 mb-3">
            <div class="small text-muted">Lead actual</div>
            <strong th:text="${lead.fullName}">Nombre lead</strong>

            <div class="small text-secondary mt-1">
                ID:
                <code th:text="${lead.id}">1</code>
            </div>
        </div>

        <form method="post"
              th:action="@{/api/crm/leads/merge}"
              class="d-grid gap-2">

            <input type="hidden"
                   name="targetLeadId"
                   th:value="${lead.id}">

            <label class="form-label small text-muted">
                ID del lead origen a fusionar
            </label>

            <input type="number"
                   name="sourceLeadId"
                   class="form-control"
                   placeholder="Ej: 25">

            <label class="form-label small text-muted mt-2">
                Estrategia
            </label>

            <select name="strategy" class="form-select">
                <option value="MERGE_NON_NULL">
                    Fusionar campos vacíos
                </option>
                <option value="KEEP_TARGET">
                    Mantener lead actual
                </option>
                <option value="KEEP_SOURCE">
                    Sobrescribir con lead origen
                </option>
            </select>

            <button type="button"
                    class="crm-btn crm-btn-primary mt-2"
                    onclick="mergeLead(this)">
                Fusionar leads
            </button>

        </form>

        <div id="mergeResult" class="mt-3"></div>

    </div>

</div>

<script>
    async function mergeLead(button) {
        const form = button.closest("form");

        const payload = {
            sourceLeadId: Number(form.sourceLeadId.value),
            targetLeadId: Number(form.targetLeadId.value),
            strategy: form.strategy.value
        };

        if (!payload.sourceLeadId || !payload.targetLeadId) {
            document.getElementById("mergeResult").innerHTML =
                '<div class="alert alert-warning">Debes indicar el lead origen.</div>';
            return;
        }

        const response = await fetch("/api/crm/leads/merge", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            document.getElementById("mergeResult").innerHTML =
                '<div class="alert alert-danger">No se pudo fusionar el lead.</div>';
            return;
        }

        const result = await response.json();

        document.getElementById("mergeResult").innerHTML =
            `<div class="alert alert-success">${result.message}</div>`;

        setTimeout(() => window.location.reload(), 900);
    }
</script>

</body>
</html>
