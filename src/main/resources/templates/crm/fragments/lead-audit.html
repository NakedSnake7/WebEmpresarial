<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="audit(lead)" class="crm-panel">

    <div class="crm-panel-header">
        <div>
            <span class="crm-kicker">Audit Log</span>
            <h3>Historial de cambios</h3>
        </div>

        <span class="badge text-bg-dark"
              th:text="${#lists.size(lead.auditLogs)} + ' cambios'">
            0 cambios
        </span>
    </div>

    <div class="mt-3">

        <div th:if="${#lists.isEmpty(lead.auditLogs)}"
             class="crm-empty">
            No hay cambios auditados para este lead.
        </div>

        <div th:each="log : ${lead.auditLogs}"
             class="border rounded p-3 mb-2">

            <div class="d-flex justify-content-between align-items-start gap-3">

                <div>
                    <h6 class="fw-bold mb-1"
                        th:text="${log.action}">
                        STATUS_CHANGED
                    </h6>

                    <p class="text-muted mb-1">
                        <strong th:text="${log.fieldName}">status</strong>
                        <span>:</span>
                        <span th:text="${log.oldValue} ?: '—'">NEW</span>
                        <span> → </span>
                        <span th:text="${log.newValue} ?: '—'">CONTACTED</span>
                    </p>

                    <small class="text-secondary">
                        Por:
                        <span th:text="${log.actor} ?: 'SYSTEM'">SYSTEM</span>
                    </small>
                </div>

                <small class="text-muted"
                       th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm')}">
                    fecha
                </small>

            </div>

        </div>

    </div>

</div>

</body>
