<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Execution Trace | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">
        <a th:href="@{|/admin/platform/timeline/${trace.correlationId}|}"
           class="small text-muted text-decoration-none">
            ← Volver al timeline
        </a>
<a th:href="@{|/admin/platform/graph/${trace.correlationId}|}"
   class="btn btn-sm btn-dark mt-3">
    Ver Execution Graph →
</a>
        <div class="mt-3">
            <span class="badge text-bg-dark mb-2">Execution Trace</span>

            <h1 class="fw-bold mb-1">Execution Graph</h1>

            <p class="text-muted mb-0">
                Correlation ID:
                <code th:text="${trace.correlationId}">correlation-id</code>
            </p>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div th:if="${trace.roots == null or trace.roots.isEmpty()}"
                 class="alert alert-warning mb-0">
                No hay nodos registrados para esta ejecución.
            </div>

            <div th:if="${trace.roots != null and !trace.roots.isEmpty()}">

<div th:each="node : ${trace.roots}"
     class="border-start border-4 ps-4 mb-4">

    <span class="badge me-2"
          th:classappend="${node.type == 'EVENT'} ? ' text-bg-primary' : ' text-bg-dark'"
          th:text="${node.type}">
        EVENT
    </span>

    <strong th:text="${node.title}">LEAD_CREATED</strong>

    <div class="small text-muted mt-2">
        <span th:text="${node.source}">CRM</span>
        ·
        <span th:text="${node.durationMs}">0</span> ms
        ·
        <span th:text="${node.occurredAt}">fecha</span>
    </div>

    <div class="small text-secondary">
        Execution:
        <code th:text="${node.executionId}">execution-id</code>
    </div>

    <div class="small text-secondary">
        Parent:
        <code th:text="${node.parentExecutionId != null ? node.parentExecutionId : 'ROOT'}">ROOT</code>
    </div>

    <div class="small text-secondary">
        Span:
        <code th:text="${node.spanId}">span-id</code>
    </div>
</div>

            </div>

        </div>
    </div>

</section>

</th:block>

</body>
</html>
