<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Execution Timeline | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">

        <span class="badge text-bg-dark mb-2">
            Platform Timeline
        </span>

        <h1 class="fw-bold mb-1">
            Execution Timeline
        </h1>

        <p class="text-muted mb-0">

            Correlation ID:

            <code th:text="${correlationId}">
                correlation-id
            </code>

        </p>

    </div>

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div th:if="${timeline.isEmpty()}">

                <div class="alert alert-warning mb-0">

                    No hay eventos registrados para esta ejecución.

                </div>

            </div>

            <div th:unless="${timeline.isEmpty()}">

                <div class="timeline">

                    <div class="timeline-item border-start border-4 ps-4 mb-4"
                         th:each="item : ${timeline}">

                        <div class="d-flex justify-content-between">

                            <div>

                                <span class="badge me-2"
                                      th:classappend="${
                                          item.type == 'EVENT'
                                          ? ' text-bg-primary'
                                          : ' text-bg-dark'
                                      }"
                                      th:text="${item.type}">
                                    EVENT
                                </span>

                                <strong
                                        th:text="${item.title}">
                                    LEAD_CREATED
                                </strong>

                            </div>

                            <span class="badge"
                                  th:classappend="${
                                      item.status == 'SUCCESS'
                                      ? ' text-bg-success'
                                      : ' text-bg-danger'
                                  }"
                                  th:text="${item.status}">
                                SUCCESS
                            </span>

                        </div>

                        <div class="mt-2 text-muted">

                            <strong>Módulo:</strong>

                            <span th:text="${item.source}">
                                CRM
                            </span>

                        </div>

                        <div class="text-muted">

                            <strong>Mensaje:</strong>

                            <span th:text="${item.message}">
                                2 listeners ejecutados
                            </span>

                        </div>

                        <div class="text-muted">

                            <strong>Duración:</strong>

                            <span th:text="${item.durationMs}">
                                15
                            </span>

                            ms

                        </div>

                        <div class="text-muted">

                            <strong>Execution ID:</strong>

                            <code th:text="${item.executionId}">
                                execution-id
                            </code>

                        </div>
                        
                        <div class="text-muted">
    <strong>Parent Execution ID:</strong>
    <code th:text="${item.parentExecutionId} ?: 'ROOT'">
        ROOT
    </code>
</div>

<div class="text-muted">
    <strong>Span ID:</strong>
    <code th:text="${item.spanId}">
        span-id
    </code>
</div>

                        <div class="text-muted">

                            <strong>Fecha:</strong>

                            <span th:text="${item.occurredAt}">
                                fecha
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</th:block>

</body>

</html>
