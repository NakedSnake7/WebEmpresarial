<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="node(node)">

    <div class="border-start border-4 ps-4 mb-3">

        <div class="d-flex justify-content-between align-items-start">

            <div>
                <span class="badge me-2"
                      th:classappend="${node.type == 'EVENT'} ? ' text-bg-primary' : ' text-bg-dark'"
                      th:text="${node.type}">
                    EVENT
                </span>

                <strong th:text="${node.title}">
                    LEAD_CREATED
                </strong>

                <div class="small text-muted mt-1">
                    <span th:text="${node.source}">CRM</span>
                    ·
                    <span th:text="${node.durationMs}">0</span> ms
                    ·
                    <span th:text="${node.occurredAt}">fecha</span>
                </div>

                <div class="small text-secondary mt-1">
                    Execution:
                    <code th:text="${node.executionId}">execution-id</code>
                </div>

                <div class="small text-secondary">
                    Parent:
                    <code th:text="${node.parentExecutionId != null ? node.parentExecutionId : 'ROOT'}">
                        ROOT
                    </code>
                </div>

                <div class="small text-secondary">
                    Span:
                    <code th:text="${node.spanId}">span-id</code>
                </div>
            </div>

            <span class="badge"
                  th:classappend="${node.status == 'SUCCESS'} ? ' text-bg-success' : ' text-bg-danger'"
                  th:text="${node.status}">
                SUCCESS
            </span>

        </div>

        <div class="ms-4 mt-3"
             th:if="${node.children != null and !node.children.isEmpty()}">

            <div th:each="child : ${node.children}"
                 th:replace="~{admin/platform/fragments/trace-node :: node(${child})}">
            </div>

        </div>

    </div>

</th:block>

</body>
</html>
