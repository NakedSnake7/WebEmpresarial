<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Execution Graph | WebEmpresarial',
        ~{::content}
)}">

<body>
<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">
        <a th:href="@{|/admin/platform/trace/${graph.correlationId}|}"
           class="small text-muted text-decoration-none">
            ← Volver al trace
        </a>

        <div class="mt-3">
            <span class="badge text-bg-dark mb-2">Execution Graph</span>
            <h1 class="fw-bold mb-1">Execution Graph</h1>
            <p class="text-muted mb-0">
                Correlation ID:
                <code th:text="${graph.correlationId}">correlation-id</code>
            </p>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Nodos</div>
                    <div class="display-6 fw-bold" th:text="${graph.totalNodes}">0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Correctos</div>
                    <div class="display-6 fw-bold text-success" th:text="${graph.successfulNodes}">0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Fallidos</div>
                    <div class="display-6 fw-bold text-danger" th:text="${graph.failedNodes}">0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small">Duración total</div>
                    <div class="display-6 fw-bold">
                        <span th:text="${graph.totalDurationMs}">0</span>
                        <span class="fs-6">ms</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h5 class="fw-bold mb-3">Visual Graph</h5>

            <div th:if="${graph.nodes == null or graph.nodes.isEmpty()}"
                 class="alert alert-warning mb-0">
                No hay nodos para esta ejecución.
            </div>

            <div th:if="${graph.nodes != null and !graph.nodes.isEmpty()}"
                 class="border rounded bg-light overflow-auto"
                 style="min-height: 620px;">

                <svg width="2200" height="1200"
                     xmlns="http://www.w3.org/2000/svg">

                    <defs>
                        <marker id="arrow"
                                markerWidth="10"
                                markerHeight="10"
                                refX="10"
                                refY="3"
                                orient="auto"
                                markerUnits="strokeWidth">
                            <path d="M0,0 L0,6 L9,3 z" fill="#6c757d"></path>
                        </marker>
                    </defs>

                    <g th:each="edge : ${graph.edges}">
                        <th:block th:each="fromNode : ${graph.nodes}"
                                  th:if="${fromNode.id == edge.from}">
                            <th:block th:each="toNode : ${graph.nodes}"
                                      th:if="${toNode.id == edge.to}">

                                <line th:attr="
                                        x1=${fromNode.x + 200},
                                        y1=${fromNode.y + 45},
                                        x2=${toNode.x},
                                        y2=${toNode.y + 45}"
                                      stroke="#6c757d"
                                      stroke-width="2"
                                      marker-end="url(#arrow)">
                                </line>

                            </th:block>
                        </th:block>
                    </g>

                    <g th:each="node : ${graph.nodes}"
                       class="graph-node"
                       th:attr="
                            transform=|translate(${node.x},${node.y})|,
                            data-execution=${node.id}">

                        <rect width="210"
                              height="92"
                              rx="14"
                              ry="14"
                              th:attr="class=${node.status == 'SUCCESS'} ? 'graph-node-success' : 'graph-node-failed'">
                        </rect>

                        <text x="16" y="24"
                              font-size="12"
                              font-weight="700"
                              fill="#111827"
                              th:text="${node.type}">
                            EVENT
                        </text>

                        <text x="16" y="48"
                              font-size="14"
                              font-weight="700"
                              fill="#111827"
                              th:text="${node.label}">
                            LEAD_CREATED
                        </text>

                        <text x="16" y="68"
                              font-size="12"
                              fill="#6b7280"
                              th:text="${node.source + ' · ' + node.durationMs + ' ms'}">
                            CRM · 10 ms
                        </text>

                        <circle cx="188"
                                cy="22"
                                r="7"
                                th:attr="class=${node.status == 'SUCCESS'} ? 'graph-dot-success' : 'graph-dot-failed'">
                        </circle>

                    </g>

                </svg>

            </div>

        </div>
    </div>

    <div id="nodeInspector"
         class="position-fixed top-0 end-0 bg-white shadow-lg border-start"
         style="width:420px;height:100%;transform:translateX(100%);transition:.25s;z-index:1050;overflow:auto;">

        <div class="p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="fw-bold mb-0">Node Inspector</h4>

                <button class="btn btn-sm btn-outline-secondary"
                        type="button"
                        onclick="closeInspector()">
                    ✕
                </button>
            </div>

            <hr>

            <div id="nodeContent" class="text-muted">
                Selecciona un nodo.
            </div>
        </div>
    </div>

    <style>
        .graph-node {
            cursor: pointer;
        }

        .graph-node:hover rect {
            stroke-width: 4;
        }

        .graph-node-success {
            fill: #ffffff;
            stroke: #198754;
            stroke-width: 2;
        }

        .graph-node-failed {
            fill: #ffffff;
            stroke: #dc3545;
            stroke-width: 2;
        }

        .graph-dot-success {
            fill: #198754;
        }

        .graph-dot-failed {
            fill: #dc3545;
        }

        #nodeInspector code {
            word-break: break-all;
            white-space: normal;
        }

        #nodeInspector pre {
            white-space: pre-wrap;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
        }
    </style>

    <script>
        document.querySelectorAll(".graph-node").forEach(node => {
            node.addEventListener("click", async () => {
                const id = node.dataset.execution;

                const response = await fetch("/api/admin/platform/nodes/" + id);

                if (!response.ok) {
                    renderInspectorError("No se pudo cargar el nodo.");
                    return;
                }

                const json = await response.json();

                if (!json) {
                    renderInspectorError("Este nodo aún no tiene detalle disponible.");
                    return;
                }

                renderInspector(json);
            });
        });

        function openInspector() {
            document.getElementById("nodeInspector").style.transform = "translateX(0)";
        }

        function closeInspector() {
            document.getElementById("nodeInspector").style.transform = "translateX(100%)";
        }

        function safe(value) {
            return value === null || value === undefined || value === "" ? "—" : value;
        }

        function statusBadge(success) {
            return success
                ? '<span class="badge text-bg-success">SUCCESS</span>'
                : '<span class="badge text-bg-danger">FAILED</span>';
        }

        function renderInspectorError(message) {
            openInspector();

            document.getElementById("nodeContent").innerHTML = `
                <div class="alert alert-warning">
                    ${message}
                </div>
            `;
        }

        function renderInspector(node) {
            openInspector();

            document.getElementById("nodeContent").innerHTML = `
                <div class="mb-3">
                    <div class="small text-muted">Nombre</div>
                    <h5 class="fw-bold">${safe(node.name)}</h5>
                </div>

                <div class="mb-3">
                    ${statusBadge(node.success)}
                    <span class="badge text-bg-dark ms-1">${safe(node.type)}</span>
                </div>

                <table class="table table-sm align-middle">
                    <tbody>
                    <tr>
                        <th>Source</th>
                        <td>${safe(node.source)}</td>
                    </tr>
                    <tr>
                        <th>Duración</th>
                        <td>${safe(node.durationMs)} ms</td>
                    </tr>
                    <tr>
                        <th>Started</th>
                        <td>${safe(node.startedAt)}</td>
                    </tr>
                    <tr>
                        <th>Finished</th>
                        <td>${safe(node.finishedAt)}</td>
                    </tr>
                    </tbody>
                </table>

                <h6 class="fw-bold mt-4">Trace IDs</h6>

                <table class="table table-sm align-middle">
                    <tbody>
                    <tr>
                        <th>Correlation</th>
                        <td><code>${safe(node.correlationId)}</code></td>
                    </tr>
                    <tr>
                        <th>Execution</th>
                        <td><code>${safe(node.executionId)}</code></td>
                    </tr>
                    <tr>
                        <th>Parent</th>
                        <td><code>${safe(node.parentExecutionId)}</code></td>
                    </tr>
                    <tr>
                        <th>Span</th>
                        <td><code>${safe(node.spanId)}</code></td>
                    </tr>
                    </tbody>
                </table>

                <h6 class="fw-bold mt-4">Message</h6>
                <pre>${safe(node.message)}</pre>
                
                <h6 class="fw-bold mt-4">Payload</h6>
                <pre>${safe(node.payload)}</pre>

                <h6 class="fw-bold mt-4">Metadata</h6>
                <pre>${safe(node.metadata)}</pre>
                
                <h6 class="fw-bold mt-4">Input</h6>
                <pre>${safe(node.input)}</pre>

                <h6 class="fw-bold mt-4">Output</h6>
                <pre>${safe(node.output)}</pre>

                <h6 class="fw-bold mt-4">Exception</h6>
                <pre>${safe(node.exceptionType)}\n${safe(node.exceptionMessage)}</pre>

                <h6 class="fw-bold mt-4">Stacktrace</h6>
                <pre>${safe(node.stacktrace)}</pre>
            `;
        }
    </script>

</section>

</th:block>
</body>
</html>
