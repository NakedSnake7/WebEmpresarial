<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Leads | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <span class="badge text-bg-success mb-2">
                CRM Legacy
            </span>

            <h1 class="fw-bold mb-1">
                Leads
            </h1>

            <p class="text-muted mb-0">
                Vista administrativa rápida de leads.
            </p>

        </div>

        <div class="d-flex gap-2">

            <a href="/crm/pipeline"
               class="btn btn-dark">

                Abrir CRM Pipeline

            </a>

            <span class="badge rounded-pill text-bg-dark fs-6"
                  th:text="${#lists.size(leads) + ' leads'}">
            </span>

        </div>

    </div>

    <div class="card border-0 shadow-sm">

        <div class="table-responsive">

            <table class="table align-middle mb-0">

                <thead class="table-light">

                <tr>
                    <th>Lead</th>
                    <th>Servicio</th>
                    <th>Status</th>
                    <th>WhatsApp</th>
                    <th>Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="lead : ${leads}">

                    <td>

                        <div class="fw-semibold"
                             th:text="${lead.nombre}">
                        </div>

                        <div class="small text-muted"
                             th:text="${lead.empresa}">
                        </div>

                    </td>

                    <td>

                        <span class="badge text-bg-dark"
                              th:text="${lead.servicio}">
                        </span>

                    </td>

                    <td>

                        <span class="badge text-bg-primary"
                              th:text="${lead.status}">
                        </span>

                    </td>

                    <td>

                        <a class="btn btn-success btn-sm"
                           target="_blank"
                           th:href="@{'https://wa.me/52' + ${lead.whatsapp}}">

                            WhatsApp

                        </a>

                    </td>
                    <td>
    <a class="btn btn-outline-dark btn-sm"
       th:href="@{/crm/leads/{id}(id=${lead.id})}">
        Ver detalle
    </a>
</td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

</th:block>

</body>
</html>
