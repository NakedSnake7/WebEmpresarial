<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Permisos | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">
        <span class="badge text-bg-dark mb-2">Platform Kernel</span>
        <h1 class="fw-bold mb-1">Permisos registrados</h1>
        <p class="text-muted mb-0">
            Permisos cargados dinámicamente por los módulos.
        </p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div th:if="${permissions == null or permissions.isEmpty()}"
                 class="alert alert-warning mb-0">
                No hay permisos registrados.
            </div>

            <div class="table-responsive"
                 th:if="${permissions != null and !permissions.isEmpty()}">

                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Feature</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="permission : ${permissions}">
                        <td>
                            <span class="badge text-bg-dark"
                                  th:text="${permission.code}">
                                crm.read
                            </span>
                        </td>

                        <td th:text="${permission.name}">
                            Leer CRM
                        </td>

                        <td class="text-muted"
                            th:text="${permission.description}">
                            Descripción
                        </td>

                        <td th:text="${permission.feature}">
                            CRM
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>

</section>

</th:block>

</body>
</html>
