<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        ${store.id == null ? 'Crear tienda | Admin' : 'Editar tienda | Admin'},
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

    <section class="container-fluid">

        <div class="mb-4">
            <span class="badge text-bg-success mb-2">Multi tienda</span>

            <h1 class="fw-bold mb-1"
                th:text="${store.id == null ? 'Crear tienda' : 'Editar tienda'}">
            </h1>

            <p class="text-muted mb-0">
                Configura themes, dominios y activación de tiendas.
            </p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="@{/admin/stores/guardar}"
                      th:object="${store}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row g-4">

                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Nombre de la tienda
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   placeholder="STRIDE"
                                   required>
                        </div>

                        <!-- Theme -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Theme
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{theme}"
                                   placeholder="stride"
                                   required>

                            <div class="form-text">
                                Debe coincidir con:
                                <code>templates/themes/stride/</code>
                            </div>
                        </div>

                        <!-- Dominio -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">
                                Dominio
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{dominio}"
                                   placeholder="stride.web-empresarial.com"
                                   required>

                            <div class="form-text">
                                También puedes usar dominios personalizados.
                            </div>
                        </div>
                        
                        <div class="col-md-6">
    <label class="form-label fw-semibold">
        Plan
    </label>

    <select class="form-select"
            th:field="*{plan}"
            required>
        <option value="BASIC">Basic</option>
        <option value="PRO">Pro</option>
        <option value="PREMIUM">Premium</option>
    </select>

    <div class="form-text">
        El plan define qué módulos tendrá disponibles la tienda.
    </div>
</div>

                        <!-- Estado -->
                        <div class="col-12">
                            <div class="form-check form-switch">

                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{activa}">

                                <label class="form-check-label fw-semibold">
                                    Tienda activa
                                </label>

                            </div>
                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-success">
                            Guardar tienda
                        </button>

                        <a th:href="@{/admin/stores}"
                           class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </section>

</th:block>

</body>
</html>
