<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Tiendas | WebEmpresarial Admin',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

    <section class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge text-bg-success mb-2">Multi tienda</span>
                <h1 class="fw-bold mb-1">Tiendas</h1>
                <p class="text-muted mb-0">
                    Administra dominios, themes y estado de cada tienda.
                </p>
            </div>

            <a th:href="@{/admin/stores/nuevo}" class="btn btn-success">
                + Crear nueva tienda
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Theme</th>
                            <th>Plan</th>
                            <th>Dominio</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="store : ${stores}">
                            <td th:text="${store.id}"></td>

                            <td class="fw-semibold" th:text="${store.nombre}"></td>

                            <td>
                                <span class="badge text-bg-dark"
                                      th:text="${store.theme}">
                                </span>
                            </td>
                            
                            <td>
    <span class="badge text-bg-info"
          th:text="${store.plan}">
    </span>
</td>

                            <td th:text="${store.dominio}"></td>

                            <td>
                                <span th:if="${store.activa}"
                                      class="badge text-bg-success">
                                    Activa
                                </span>

                                <span th:unless="${store.activa}"
                                      class="badge text-bg-secondary">
                                    Inactiva
                                </span>
                            </td>

                            <td class="text-end">
                            
                            <a th:href="@{/admin/stores/{id}/admins(id=${store.id})}"
                              class="btn btn-sm btn-outline-dark">
                                 Admins
                                </a>

                                <a th:href="@{/admin/stores/editar/{id}(id=${store.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Editar
                                </a>

                                <form th:action="@{/admin/stores/estado/{id}(id=${store.id})}"
                                      method="post"
                                      class="d-inline">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-warning">
                                        Activar / Desactivar
                                    </button>
                                </form>

                                <form th:action="@{/admin/stores/eliminar/{id}(id=${store.id})}"
                                      method="post"
                                      class="d-inline">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('¿Eliminar esta tienda?')">
                                        Eliminar
                                    </button>
                                </form>

                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(stores)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                No hay tiendas registradas todavía.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </section>

</th:block>

</body>
</html>
