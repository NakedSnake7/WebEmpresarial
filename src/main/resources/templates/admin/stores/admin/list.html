<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Admins de tienda | WebEmpresarial Admin',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

    <section class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <span class="badge text-bg-dark mb-2">
                    Admins de tienda
                </span>

                <h1 class="fw-bold mb-1">
                    <span th:text="${store.nombre}"></span>
                </h1>

                <p class="text-muted mb-0">
                    Gestiona administradores y personal de esta tienda.
                </p>
            </div>

            <a th:href="@{/admin/stores/{id}/admins/nuevo(id=${store.id})}"
               class="btn btn-success">
                + Nuevo admin
            </a>

        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="admin : ${admins}">

                            <td th:text="${admin.id}"></td>

                            <td class="fw-semibold"
                                th:text="${admin.fullName}">
                            </td>

                            <td th:text="${admin.email}"></td>

                            <td>
                                <span class="badge text-bg-info"
                                      th:text="${admin.role}">
                                </span>
                            </td>

                            <td>

                                <span th:if="${admin.enabled}"
                                      class="badge text-bg-success">
                                    Activo
                                </span>

                                <span th:unless="${admin.enabled}"
                                      class="badge text-bg-secondary">
                                    Inactivo
                                </span>

                            </td>

                            <td class="text-end">

                                <form th:action="@{/admin/stores/{storeId}/admins/estado/{id}(storeId=${store.id},id=${admin.id})}"
                                      method="post"
                                      class="d-inline">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-warning">

                                        Activar / Desactivar

                                    </button>

                                </form>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(admins)}">

                            <td colspan="6"
                                class="text-center text-muted py-4">

                                No hay administradores registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </section>

</th:block>

</body>
</html>
