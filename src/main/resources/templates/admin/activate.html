<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Activar cuenta | WebEmpresarial</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Activa tu cuenta
                        </h2>

                        <p class="text-muted mb-0">
                            Define la contraseña con la que
                            administrarás tu tienda.
                        </p>

                    </div>

                    <div
                        th:if="${activationError != null}"
                        class="alert alert-danger"
                        role="alert"
                        th:text="${activationError}">
                        Token inválido.
                    </div>

                    <div
                        th:if="${activationError == null}">

                        <div
                            th:if="${email != null}"
                            class="mb-4">

                            <label class="form-label">
                                Cuenta
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                th:value="${email}"
                                disabled>

                        </div>

                        <form
                            method="post"
                            th:action="@{/admin/activate}">

                            <th:block
                                th:replace="~{fragments/csrf :: token}">
                            </th:block>

                            <input
                                type="hidden"
                                name="token"
                                th:value="${token}">

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required>

                                <div class="form-text">
                                    Mínimo 8 caracteres.
                                </div>

                            </div>

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label">
                                    Confirmar contraseña
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-control"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-dark w-100">

                                Activar cuenta

                            </button>

                        </form>

                    </div>

                    <div class="text-center mt-4">

                        <a
                            href="/admin/login"
                            class="text-decoration-none">

                            Volver al inicio de sesión

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
