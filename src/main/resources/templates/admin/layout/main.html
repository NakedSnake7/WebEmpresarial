<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title} ?: 'Admin'">
        Admin
    </title>
<link rel="icon"
      type="image/x-icon"
      th:href="@{|/themes/${theme}/favicon.ico|}">
      
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- ADMIN -->
    <link rel="stylesheet"
          th:href="@{/assets/css/admin.css}">

    <!-- CRM -->
    <th:block th:if="${crmPage}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-core.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-components.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-dashboard.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-pipeline.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-drawer.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-tasks.css}">

        <link rel="stylesheet"
              th:href="@{/assets/css/crm/crm-responsive.css}">

    </th:block>

</head>

<body th:class="${crmPage} ? 'crm-body' : 'bg-light'">

<div class="d-flex min-vh-100">

    <!-- SIDEBAR -->
    <aside th:replace="~{admin/fragments/sidebar :: sidebar}">
    </aside>

    <!-- CONTENT -->
    <div class="flex-grow-1 admin-main-content">

        <!-- TOPBAR -->
        <header th:replace="~{admin/fragments/topbar :: topbar}">
        </header>

        <!-- PAGE -->
        <main class="p-4"
              th:replace="${content}">
        </main>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Sidebar -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    const sidebar = document.getElementById('adminSidebar');
    const toggle = document.getElementById('sidebarToggle');

    if (!sidebar || !toggle) return;

    const saved = localStorage.getItem('adminSidebarCollapsed');

    if (saved === 'true') {
        sidebar.classList.add('collapsed');
    }

    toggle.addEventListener('click', function () {

        sidebar.classList.toggle('collapsed');

        localStorage.setItem(
            'adminSidebarCollapsed',
            sidebar.classList.contains('collapsed')
        );

    });

});
</script>

<!-- CRM APP -->
<script type="module"
        th:src="@{/assets/js/crm/crm-app.js}"
        th:if="${crmPage}">
</script>

</body>
</html>
