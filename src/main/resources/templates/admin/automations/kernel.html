<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Automatizaciones Kernel | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">
        <span class="badge text-bg-dark mb-2">Platform Kernel</span>
        <h1 class="fw-bold mb-1">Automatizaciones registradas</h1>
        <p class="text-muted mb-0">
            Automatizaciones declaradas dinámicamente por los módulos.
        </p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div th:if="${automations == null or automations.isEmpty()}"
                 class="alert alert-warning mb-0">
                No hay automatizaciones registradas.
            </div>

            <div class="table-responsive"
                 th:if="${automations != null and !automations.isEmpty()}">

                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Trigger</th>
                        <th>Feature</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="automation : ${automations}">
                        <td>
                            <span class="badge text-bg-dark"
                                  th:text="${automation.code}">
                                crm.lead.created.task
                            </span>
                        </td>

                        <td th:text="${automation.name}">
                            Automatización
                        </td>

                        <td>
                            <span class="badge text-bg-info"
                                  th:text="${automation.trigger}">
                                LEAD_CREATED
                            </span>
                        </td>

                        <td th:text="${automation.feature}">
                            LEADS
                        </td>

                        <td class="text-muted"
                            th:text="${automation.description}">
                            Descripción
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>

</section>

</th:block>

</body>
</html>
