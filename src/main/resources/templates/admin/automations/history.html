<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Historial de automatizaciones | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="mb-4">
        <span class="badge text-bg-dark mb-2">Platform Kernel</span>

        <h1 class="fw-bold mb-1">
            Historial de automatizaciones
        </h1>

        <p class="text-muted mb-0">
            Ejecuciones recientes del Automation Engine.
        </p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div th:if="${executions == null or executions.isEmpty()}"
                 class="alert alert-warning mb-0">
                Aún no hay ejecuciones registradas.
            </div>

            <div class="table-responsive"
                 th:if="${executions != null and !executions.isEmpty()}">

                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Estado</th>
                        <th>Trigger</th>
                        <th>Acciones</th>
                        <th>Duración</th>
                        <th>Inicio</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="execution : ${executions}">
                        <td>
                            <span class="badge"
                                  th:classappend="${execution.success} ? ' text-bg-success' : ' text-bg-danger'"
                                  th:text="${execution.success} ? 'OK' : 'ERROR'">
                                OK
                            </span>
                        </td>

                        <td>
                            <span class="badge text-bg-dark"
                                  th:text="${execution.triggerName}">
                                LEAD_CREATED
                            </span>
                        </td>

                        <td th:text="${execution.totalActions}">
                            0
                        </td>

                        <td>
                            <span th:text="${execution.totalDurationMs}">
                                0
                            </span> ms
                        </td>

                        <td class="small text-muted"
                            th:text="${#temporals.format(execution.startedAt, 'dd/MM/yyyy HH:mm:ss')}">
                            Fecha
                        </td>

                        <td class="text-end">
                            <a th:href="@{|/admin/automations/history/${execution.id}|}"
                               class="btn btn-sm btn-outline-dark">
                                Ver detalle
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>

</section>

</th:block>

</body>
</html>
