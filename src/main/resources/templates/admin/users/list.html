<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Equipo',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

    <section class="container-fluid">

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <div>

                <span class="badge text-bg-dark mb-2">
                    Equipo
                </span>

                <h1 class="fw-bold mb-1">
                    <span th:text="${store.nombre}"></span>
                </h1>

                <p class="text-muted mb-0">
                    Gestiona los usuarios que tienen acceso
                    al panel administrativo de esta tienda.
                </p>

            </div>

            <a th:href="@{/admin/users/nuevo}"
               class="btn btn-success"
               th:if="${canInviteTeam}">
                + Nuevo usuario
            </a>

        </div>

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover
                                  align-middle mb-0">

                        <thead class="table-light">

                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-end">
                                Acciones
                            </th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="admin : ${admins}">

                            <td th:text="${admin.id}">
                            </td>

                            <td class="fw-semibold"
                                th:text="${admin.fullName}">
                            </td>

                            <td th:text="${admin.email}">
                            </td>

                            <td>

                                <span class="badge text-bg-info"
                                      th:text="${
                                        admin.role.name() == 'STORE_OWNER'
                                            ? 'Propietario'
                                            : (
                                                admin.role.name() == 'STORE_ADMIN'
                                                    ? 'Administrador'
                                                    : (
                                                        admin.role.name() == 'STORE_STAFF'
                                                            ? 'Personal operativo'
                                                            : (
                                                                admin.role.name() == 'SALES'
                                                                    ? 'Ventas / CRM'
                                                                    : admin.role.name()
                                                            )
                                                    )
                                            )
                                      }">
                                </span>

                            </td>

                            <td>

                                <span th:if="${admin.enabled}"
                                      class="badge text-bg-success">
                                    Activo
                                </span>

                                <span th:unless="${admin.enabled}"
                                      class="badge text-bg-secondary">
                                    Inactivo
                                </span>

                            </td>

                            <td class="text-end"
                                th:with="
                                    canManageTarget=${
                                        canEditTeam
                                        and admin.role.name() != 'STORE_OWNER'
                                        and (
                                            isSuperAdmin
                                            or isStoreOwner
                                            or (
                                                isStoreAdmin
                                                and (
                                                    admin.role.name() == 'STORE_STAFF'
                                                    or admin.role.name() == 'SALES'
                                                )
                                            )
                                        )
                                    }
                                ">

                                <form th:if="${canManageTarget}"
                                      th:action="@{/admin/users/estado/{id}(id=${admin.id})}"
                                      method="post"
                                      class="d-inline">

                                    <th:block
                                        th:replace="~{fragments/csrf :: token}">
                                    </th:block>

                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${
                                                admin.enabled
                                                    ? 'btn-outline-danger'
                                                    : 'btn-outline-success'
                                            }"
                                            th:text="${
                                                admin.enabled
                                                    ? 'Desactivar'
                                                    : 'Activar'
                                            }">
                                    </button>

                                </form>

                                <span th:unless="${canManageTarget}"
                                      class="text-muted small">

                                    <span th:if="${
                                        admin.role.name()
                                            == 'STORE_OWNER'
                                    }">
                                        Propietario protegido
                                    </span>

                                    <span th:unless="${
                                        admin.role.name()
                                            == 'STORE_OWNER'
                                    }">
                                        Sin permisos
                                    </span>

                                </span>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(admins)}">

                            <td colspan="6"
                                class="text-center
                                       text-muted py-4">

                                No hay usuarios del equipo registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>

</th:block>

</body>
</html>
