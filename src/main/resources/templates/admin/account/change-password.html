<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="referrer" content="no-referrer">

    <title>Cambiar contraseña | WebEmpresarial</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top left,
                    #1d3655,
                    transparent 50%
                ),
                #0b1220;
            color: #f8fafc;
        }

        .card {
            width: min(100%, 470px);
            padding: 32px;
            background: #111d30;
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0005;
        }

        .brand {
            color: #93c5fd;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .05em;
        }

        h1 {
            font-size: 26px;
            margin: 16px 0 10px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin: 22px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0b1220;
            color: #fff;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #60a5fa;
            outline-offset: 1px;
        }

        .hint {
            margin-top: 9px;
            font-size: 12px;
        }

        .error {
            padding: 12px 14px;
            border: 1px solid #ef4444;
            border-radius: 10px;
            background: #450a0a;
            color: #fecaca;
            margin: 20px 0;
        }

        .submit {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:hover { background: #1d4ed8; }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>
<main class="card">
    <div class="brand">WEBEMPRESARIAL™</div>

    <h1>Cambiar contraseña</h1>

    <p>
        Introduce tu contraseña actual y establece
        una nueva para tu cuenta administrativa.
    </p>

    <div th:if="${passwordError != null}"
         th:text="${passwordError}"
         class="error"
         role="alert">
    </div>

    <form th:action="@{/admin/account/password}"
          method="post">

        <input th:if="${_csrf != null}"
               type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="currentPassword">
            Contraseña actual
        </label>

        <input id="currentPassword"
               name="currentPassword"
               type="password"
               autocomplete="current-password"
               required>

        <label for="newPassword">
            Nueva contraseña
        </label>

        <input id="newPassword"
               name="newPassword"
               type="password"
               autocomplete="new-password"
               minlength="12"
               required>

        <label for="confirmPassword">
            Confirmar nueva contraseña
        </label>

        <input id="confirmPassword"
               name="confirmPassword"
               type="password"
               autocomplete="new-password"
               minlength="12"
               required>

        <p class="hint">
            Mínimo 12 caracteres. La nueva contraseña
            debe ser diferente a la actual.
        </p>

        <button class="submit" type="submit">
            Actualizar contraseña
        </button>
    </form>

    <button class="back"
            type="button"
            onclick="window.history.back()"
            style="background:none;border:0;cursor:pointer;font:inherit">
        Volver
    </button>
</main>
</body>
</html>
