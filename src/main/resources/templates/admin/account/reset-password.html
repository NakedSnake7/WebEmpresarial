<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">

    <title>Restablecer contraseña | WebEmpresarial</title>

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #0b1220;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
        }

        .card {
            width: min(100%, 470px);
            padding: 32px;
            background: #111d30;
            border: 1px solid #334155;
            border-radius: 18px;
        }

        .brand {
            color: #93c5fd;
            font-weight: 700;
            font-size: 14px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0b1220;
            color: #fff;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 26px;
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            padding: 14px;
            margin: 20px 0;
            border-radius: 10px;
            background: #450a0a;
            border: 1px solid #ef4444;
            color: #fecaca;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #93c5fd;
        }
    </style>
</head>

<body>

<main class="card">

    <div class="brand">WEBEMPRESARIAL™</div>

    <h1>Restablecer contraseña</h1>

    <p>
        Establece una contraseña nueva de al menos
        12 caracteres. El enlace solo puede utilizarse
        una vez y caduca en 20 minutos.
    </p>

    <div th:if="${passwordError != null}"
         th:text="${passwordError}"
         class="error"
         role="alert">
    </div>

    <form th:action="@{/admin/password/reset}"
          method="post">

        <input th:if="${_csrf != null}"
               type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="newPassword">
            Nueva contraseña
        </label>

        <input id="newPassword"
               name="newPassword"
               type="password"
               autocomplete="new-password"
               minlength="12"
               required>

        <label for="confirmPassword">
            Confirmar contraseña
        </label>

        <input id="confirmPassword"
               name="confirmPassword"
               type="password"
               autocomplete="new-password"
               minlength="12"
               required>

        <button type="submit">
            Guardar nueva contraseña
        </button>
    </form>

    <a class="back"
       th:href="@{/admin/password/forgot}">
        Solicitar otro enlace
    </a>

</main>
</body>
</html>
