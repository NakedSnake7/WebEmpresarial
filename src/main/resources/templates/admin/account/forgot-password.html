<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">

    <title>Recuperar acceso | WebEmpresarial</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: #0b1220;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
        }

        .card {
            width: min(100%, 460px);
            padding: 32px;
            background: #111d30;
            border: 1px solid #334155;
            border-radius: 18px;
        }

        .brand {
            color: #93c5fd;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .05em;
        }

        h1 { font-size: 26px; }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 24px 0 8px;
            font-weight: 600;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0b1220;
            color: #fff;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .notice {
            padding: 14px;
            background: #102d26;
            border: 1px solid #166534;
            border-radius: 10px;
            color: #bbf7d0;
        }

        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #93c5fd;
        }
    </style>
</head>

<body>

<main class="card">

    <div class="brand">WEBEMPRESARIAL™</div>

    <h1>Recuperar acceso</h1>

    <p>
        Introduce el correo de tu cuenta administrativa.
        Si está registrado, recibirás un enlace temporal
        para establecer una nueva contraseña.
    </p>

    <div th:if="${param.sent != null}"
         class="notice"
         role="status">

        Si existe una cuenta asociada al correo,
        recibirás instrucciones para recuperar tu acceso.
    </div>

    <form th:action="@{/admin/password/forgot}"
          method="post">

        <input th:if="${_csrf != null}"
               type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="email">
            Correo electrónico
        </label>

        <input id="email"
               name="email"
               type="email"
               autocomplete="email"
               maxlength="254"
               required>

        <button type="submit">
            Enviar instrucciones
        </button>
    </form>

    <a class="back"
       th:href="@{/admin/login}">
        Volver al inicio de sesión
    </a>

</main>
</body>
</html>
