<aside th:fragment="sidebar"
       class="admin-sidebar"
       id="adminSidebar">

    <div class="sidebar-brand">
        <div class="brand-logo">WE</div>

        <div class="sidebar-text">
            <strong>WebEmpresarial</strong>
            <small th:text="${store != null ? store.plan : 'Commerce Admin'}">
                Commerce Admin
            </small>
        </div>

        <button type="button"
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Plegar menú">
            ☰
        </button>
    </div>

    <nav class="sidebar-nav">

        <a href="/admin/dashboard" class="sidebar-link">
            <span class="sidebar-icon">🏠</span>
            <span class="sidebar-text">Dashboard</span>
        </a>

        <a href="/admin/billing" class="sidebar-link">
            <span class="sidebar-icon">💼</span>
            <span class="sidebar-text">Billing</span>
        </a>

<th:block th:each="section : ${sidebarSections}">

    <div class="sidebar-section sidebar-text">
        <span th:text="${section.icon}">📁</span>
        <span th:text="${section.title}">Sección</span>
    </div>

    <a th:each="item : ${section.items}"
       th:href="${item.url}"
       class="sidebar-link">

        <span class="sidebar-icon"
              th:text="${item.icon}">
            📦
        </span>

        <span class="sidebar-text"
              th:text="${item.title}">
            Módulo
        </span>

        <span class="badge bg-warning ms-auto"
              th:if="${item.locked}"
              th:text="${item.badge}">
            Upgrade
        </span>

    </a>

</th:block>





<div class="sidebar-section sidebar-text"
     th:if="${isSuperAdmin}">
    Sistema
</div>

<a href="/admin/permissions"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🔐</span>
    <span class="sidebar-text">Permisos</span>
</a>

<a href="/admin/automations/kernel"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">⚙️</span>
    <span class="sidebar-text">Kernel Automations</span>
</a>

<a href="/admin/automations/history"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🕓</span>
    <span class="sidebar-text">Historial Automations</span>
</a>

<a href="/admin/platform"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🧠</span>
    <span class="sidebar-text">Platform Console</span>
</a>

<a href="/admin/platform/operations"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🛰️</span>
    <span class="sidebar-text">Operations</span>
</a>

<a href="/admin/stores"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🏬</span>
    <span class="sidebar-text">Tiendas</span>
</a>

<a href="/admin/saas"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🚀</span>
    <span class="sidebar-text">SaaS Dashboard</span>
</a>

<a href="/admin/marketplace"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🧩</span>
    <span class="sidebar-text">Marketplace</span>
</a>

<a href="/admin/subscriptions"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">💳</span>
    <span class="sidebar-text">Suscripciones</span>
</a>

<a href="/admin/platform/dev"
   class="sidebar-link"
   th:if="${isSuperAdmin}">
    <span class="sidebar-icon">🧪</span>
    <span class="sidebar-text">Developer Kit</span>
</a>

    </nav>

    <div class="sidebar-footer">

        <a href="/" target="_blank" class="sidebar-link">
            <span class="sidebar-icon">🌐</span>
            <span class="sidebar-text">Ver sitio</span>
        </a>

        <a href="/admin/store/settings" class="sidebar-link">
            <span class="sidebar-icon">⚙️</span>
            <span class="sidebar-text">Configuración</span>
        </a>

        <a href="/admin/logout" class="sidebar-link logout">

        </a>

    </div>

</aside>
