<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="tabs(activeTab)">

    <ul class="nav nav-tabs mb-4">

        <li class="nav-item">
            <a href="/admin/platform"
               class="nav-link"
               th:classappend="${activeTab == 'console'}
                   ? ' active'
                   : ''">
                Console
            </a>
        </li>

        <li class="nav-item">
            <a href="/admin/platform/operations"
               class="nav-link"
               th:classappend="${activeTab == 'operations'}
                   ? ' active'
                   : ''">

            <a href="/admin/platform/dev"
               class="nav-link"
               th:classappend="${activeTab == 'developer'}
                   ? ' active'
                   : ''">

            </a>
        </li>

        <li class="nav-item">
            <a href="/admin/permissions"
               class="nav-link"
               th:classappend="${activeTab == 'permissions'}
                   ? ' active'
                   : ''">

            </a>
        </li>

        <li class="nav-item">
            <a href="/admin/marketplace"
               class="nav-link"
               th:classappend="${activeTab == 'marketplace'}

                   : ''">

</th:block>

</html>
