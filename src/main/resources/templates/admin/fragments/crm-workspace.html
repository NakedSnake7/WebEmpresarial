<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tabs(activeTab)"
     class="mb-4"
     th:classappend="${crmPage}
         ? ' crm-panel p-2'
         : ' card border-0 shadow-sm p-2'">

    <nav class="nav nav-pills gap-1 flex-wrap"
         aria-label="Secciones del CRM">

        <a th:if="${canViewCrm}"
           th:href="@{/crm/dashboard}"
           class="nav-link"
           th:classappend="${activeTab == 'summary'}
               ? ' active'
               : ''">
            Resumen
        </a>

        <a th:if="${canViewPipeline}"
           th:href="@{/crm/pipeline}"
           class="nav-link"
           th:classappend="${activeTab == 'pipeline'}
               ? ' active'
               : ''">
            Pipeline
        </a>

        <a th:if="${canViewCrm}"
           th:href="@{/admin/leads}"
           class="nav-link"
           th:classappend="${activeTab == 'leads'}
               ? ' active'
               : ''">
            Leads
        </a>

        <a th:if="${canViewCrm}"
           th:href="@{/crm/tasks}"
           class="nav-link"
           th:classappend="${activeTab == 'tasks'}
               ? ' active'
               : ''">
            Tareas
        </a>

    </nav>

</div>

</body>
</html>
