<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/main :: layout(
        'Actualizar plan | WebEmpresarial',
        ~{::content}
)}">

<body>

<th:block th:fragment="content">

<section class="container-fluid">

    <div class="card border-0 shadow-sm">
        <div class="card-body p-5 text-center">

            <span th:if="${upgradeRequired}"
                  class="badge text-bg-warning mb-3">
                Función bloqueada
            </span>

            <span th:unless="${upgradeRequired}"
                  class="badge text-bg-success mb-3">
                Función disponible
            </span>

            <h1 th:if="${upgradeRequired}"
                class="fw-bold mb-3">
                Esta función requiere un plan superior
            </h1>

            <h1 th:unless="${upgradeRequired}"
                class="fw-bold mb-3">
                Esta función ya está incluida en tu plan
            </h1>

            <p class="text-muted mb-1">
                Función solicitada:
                <strong th:text="${feature != null ? feature : 'Módulo avanzado'}">
                    PIPELINE
                </strong>
            </p>

            <p th:if="${upgradeRequired}"
               class="text-muted mb-4">
                Necesitas actualizar al plan
                <strong th:text="${requiredPlan}">
                    PRO
                </strong>
                para usar esta funcionalidad.
            </p>

            <p th:unless="${upgradeRequired}"
               class="text-muted mb-4">
                Tu plan actual
                <strong th:text="${currentPlan}">
                    PRO
                </strong>
                ya incluye esta funcionalidad.
            </p>

            <form th:if="${canManageBilling and upgradeRequired}"
                  method="post"
                  th:action="@{/admin/billing/checkout}"
                  class="d-inline">

                <th:block th:replace="~{fragments/csrf :: token}"></th:block>

                <input type="hidden"
                       name="plan"
                       th:value="${requiredPlan}">

                <button type="submit"
                        class="btn btn-dark btn-lg">
                    Actualizar a
                    <span th:text="${requiredPlan}">PRO</span>
                </button>

            </form>

            <div class="mt-3">
                <a th:if="${canViewBilling}"
                   th:href="@{/admin/billing}"
                   class="text-muted">
                    Ver todos los planes
                </a>
            </div>

        </div>
    </div>

</section>

</th:block>

</body>
</html>
